name: ChemAtlas Pages validation and deployment
on:
  pull_request:
    branches: [main, codex/student-archive-recovery]
  push:
    branches: [main, codex/github-pages-supabase-migration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chematlas-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_localfixture
      VITE_CHEMATLAS_CONTENT_PREFIX: shared/releases/fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:private --built
      - run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: pnpm run build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:pages:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-verification-${{ github.sha }}
          # Screenshots contain source questions; retain them locally only.
          path: test-results/pages/results.json
          if-no-files-found: ignore
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CHEMATLAS_PAGES_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CHEMATLAS_CONTENT_PREFIX: ${{ vars.VITE_CHEMATLAS_CONTENT_PREFIX }}
      - name: Record artifact identity
        run: |
          printf '%s\n' '${{ github.sha }}' > dist-pages/application-sha.txt
          node scripts/pages/assert-artifact.mjs
          find dist-pages -type f -print0 | sort -z | xargs -0 sha256sum > pages-sha256.txt
          cat pages-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-digests-${{ github.sha }}
          path: pages-sha256.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
